<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitLab - Acceso de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="index.html">FitLab ⚡</a>
        <div class="ms-auto">
          <a href="index.html" class="btn btn-outline-light btn-sm">⬅ Volver al Inicio</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card border-0">
          <div class="card-body p-4">
            
            <
            <ul class="nav nav-tabs nav-justified mb-4" id="tabUsuario" role="tablist">
              <li class="nav-item">
                <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button">Ingresar</button>
              </li>
              <li class="nav-item">
                <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button">Crear Usuario</button>
              </li>
            </ul>

            <div class="tab-content" id="tabUsuarioContent">
              
              >
              <div class="tab-pane fade show active" id="loginPane">
                <form id="formLogin" onsubmit="validarLogin(event)" novalidate>
                  <div class="mb-3">
                    <label for="loginCorreo" class="form-label fw-bold">Correo Electrónico</label>
                    <input type="email" class="form-control" id="loginCorreo" placeholder="correo@ejemplo.com">
                  </div>
                  <div class="mb-3">
                    <label for="loginPass" class="form-label fw-bold">Contraseña</label>
                    <input type="password" class="form-control" id="loginPass" placeholder="******">
                  </div>
                  <button type="submit" class="btn btn-warning w-100 fw-bold">Iniciar Sesión</button>
                </form>
              </div>


              <div class="tab-pane fade" id="registerPane">
                <form id="formRegister" onsubmit="validarRegistro(event)" novalidate>
                  <div class="mb-3">
                    <label for="regNombre" class="form-label fw-bold">Nombre Completo</label>
                    <input type="text" class="form-control" id="regNombre" placeholder="Ej. Juan Pérez">
                  </div>
                  <div class="mb-3">
                    <label for="regCorreo" class="form-label fw-bold">Correo Electrónico</label>
                    <input type="email" class="form-control" id="regCorreo" placeholder="correo@ejemplo.com">
                  </div>
                  <div class="mb-3">
                    <label for="regPass" class="form-label fw-bold">Crear Contraseña</label>
                    <input type="password" class="form-control" id="regPass" placeholder="Mínimo 6 caracteres">
                  </div>
                  <button type="submit" class="btn btn-dark w-100 fw-bold">Registrarme en FitLab</button>
                </form>
              </div>

            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

 
  <div class="modal fade" id="modalNotificación" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header" id="headerNotificacion">
          <h5 class="modal-title fw-bold" id="tituloNotificacion">Notificación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cuerpoNotificacion"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-dark" data-bs-dismiss="modal">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="funciones.js"></script>
</body>
</html>
